services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: db90-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db90_development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: db90-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: db90-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: db90-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: db90-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: db90-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  keycloak-init:
    image: quay.io/keycloak/keycloak:latest
    container_name: db90-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/disable-ssl.sh:/opt/keycloak/disable-ssl.sh
    entrypoint: ["/bin/bash", "/opt/keycloak/disable-ssl.sh"]
    network_mode: "service:keycloak"
    restart: "no"

  # ---- Application services ----

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.dev
    container_name: db90-api
    ports:
      - "3000:3000"
    volumes:
      - ./packages/api:/app
      - api-bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      KEYCLOAK_ISSUER: http://localhost:8080/realms/db90
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/db90/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    stdin_open: true
    tty: true

  sidekiq:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.dev
    container_name: db90-sidekiq
    volumes:
      - ./packages/api:/app
      - api-bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      KEYCLOAK_ISSUER: http://localhost:8080/realms/db90
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/db90/protocol/openid-connect/certs
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./packages/web
    container_name: db90-web
    ports:
      - "5173:5173"
    volumes:
      - ./packages/web:/app
      - web-node-modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:3000
      DOCKER: "true"
    depends_on:
      - api

  worker:
    build:
      context: ./temporal
    container_name: db90-worker
    volumes:
      - ./temporal:/app
      - worker-bundle:/usr/local/bundle
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: db90-tasks
    depends_on:
      - temporal
    profiles:
      - worker

  remote:
    build:
      context: ./docker/remote
      args:
        platform: '${PLATFORM:-linux_arm64}'
    stdin_open: true
    tty: true
    volumes:
      - ./docker/remote/Makefile:/app/Makefile
    environment: &remote-environment
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-2}
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_SECURITY_TOKEN
      - AWS_SESSION_EXPIRATION
      - PROJECT=db90
      - USE_IMAGE_TAG_ENV_PREFIX=true
      - CI_COMMIT_SHA
      - CI_COMMIT_BRANCH
    profiles:
      - remote

  toolbox:
    image: ghcr.io/artempartos/ecs_toolbox:latest
    stdin_open: true
    tty: true
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-2}
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_SECURITY_TOKEN
      - AWS_SESSION_EXPIRATION
      - PROJECT=db90
      - USE_IMAGE_TAG_ENV_PREFIX=true
      - CI_COMMIT_SHA
      - CI_COMMIT_BRANCH
      - DOCKER_DEFAULT_PLATFORM=linux/amd64
    volumes:
      - .:/app:cached
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - remote

volumes:
  postgres-data:
  redis-data:
  minio-data:
  temporal-data:
  api-bundle:
  web-node-modules:
  worker-bundle:
