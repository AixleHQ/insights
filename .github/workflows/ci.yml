name: DB90 CI/CD Pipeline

on: [push]

env:
  PROJECT: db90
  APPLICATION: app
  USE_IMAGE_TAG_ENV_PREFIX: true
  CI_COMMIT_BRANCH: ${{ github.ref_name }}
  CI_COMMIT_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    strategy:
      matrix:
        image:
          - api
          - web
          - temporal-worker
          - keycloak
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and push ${{ matrix.image }}
        run: |
          ecs_helper build_and_push \
            --image=${{ matrix.image }} \
            --file=./Dockerfile.${{ matrix.image }}

  # --- API checks (build from source with CI target) ---

  api_test:
    name: API Tests (RSpec)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bash -c "bundle exec rails db:create db:schema:load && bundle exec rspec"
      container_name: api

  api_lint:
    name: API Lint (Rubocop)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec rubocop --parallel
      container_name: api

  api_security:
    name: API Security (Brakeman)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec brakeman --no-pager
      container_name: api

  # --- Web checks ---

  web_test:
    name: Web Tests (Vitest)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run test:run
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_lint:
    name: Web Lint (ESLint)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run lint
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_typecheck:
    name: Web Typecheck (TypeScript)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npx tsc --noEmit
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  # --- Deploy pipeline (staging and main only) ---

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    needs: [build]
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      APPLICATION: api
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run db:migrate
        run: |
          ecs_helper run_command --command "bundle exec rails db:migrate" --name 'db-migrate'

  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    needs: [migrate]
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    strategy:
      matrix:
        service:
          - api
          - web
          - sidekiq
          - temporal-worker
          - keycloak
      max-parallel: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ${{ matrix.service }}
        run: APPLICATION=${{ matrix.service }} ecs_helper deploy --timeout 3600
