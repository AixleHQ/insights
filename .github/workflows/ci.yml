name: DB90 CI/CD Pipeline

on: [push]

env:
  PROJECT: db90
  APPLICATION: app
  USE_IMAGE_TAG_ENV_PREFIX: true
  CI_COMMIT_BRANCH: ${{ github.ref_name }}
  CI_COMMIT_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    strategy:
      matrix:
        image:
          - api
          - web
          - temporal-worker
          - keycloak
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and push ${{ matrix.image }}
        run: |
          ecs_helper build_and_push \
            --image=${{ matrix.image }} \
            --file=./Dockerfile.${{ matrix.image }}

  # --- API checks (build from source with CI target) ---

  api_test:
    name: API Tests (RSpec)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bash -c "bundle exec rails db:create db:schema:load && bundle exec rspec"
      container_name: api

  api_lint:
    name: API Lint (Rubocop)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec rubocop --parallel
      container_name: api

  api_security:
    name: API Security (Brakeman)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec brakeman --no-pager
      container_name: api

  # --- Web checks ---

  web_test:
    name: Web Tests (Vitest)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run test:run
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_lint:
    name: Web Lint (ESLint)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run lint
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_typecheck:
    name: Web Typecheck (TypeScript)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npx tsc --noEmit
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  # --- @aixle/insights (packages/tools/aixle-insights/) ---

  aixle_insights_check:
    name: "@aixle/insights (build + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools
      - name: Test
        run: npm test --workspace=@aixle/insights
        working-directory: packages/tools

  aixle_insights_windows_install:
    name: "@aixle/insights (Windows install smoke — better-sqlite3)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      # Upgrade npm so its bundled node-gyp (12.x+) recognises VS 2025/2026
      # (version "18" in the install path). The default npm on windows-latest
      # ships node-gyp 10.x which reports VS 18.x as "unknown version undefined"
      # and cannot find any VS installation to compile better-sqlite3.
      - name: Upgrade npm (ships node-gyp 12+ with VS 2025/2026 support)
        run: npm install -g npm@latest
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build aixle-insights native dependency
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools

  # --- Deploy pipeline (staging and main only) ---

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    needs: [build, api_test, api_lint, api_security, web_test, web_lint, web_typecheck, aixle_insights_check, aixle_insights_windows_install]
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      APPLICATION: api
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run db:migrate
        run: |
          ecs_helper run_command --command "bundle exec rails db:migrate" --name 'db-migrate'

  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    needs: [migrate]
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    strategy:
      matrix:
        service:
          - api
          - web
          - sidekiq
          - temporal-worker
          - keycloak
      max-parallel: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ${{ matrix.service }}
        run: APPLICATION=${{ matrix.service }} ecs_helper deploy --timeout 3600

  post_deploy:
    name: Post Deploy (Rollbar)
    runs-on: ubuntu-latest
    container: ghcr.io/artempartos/ecs_toolbox:latest
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      APPLICATION: api
    needs: [deploy]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Notify Rollbar of deploy
        run: |
          COMMIT_SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          ACTOR_ID="${{ github.actor_id }}"
          DEPLOY_USER="${ACTOR} ${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          ecs_helper run_command \
            --command "bash -c 'export DEPLOY_REVISION=${COMMIT_SHA} && export DEPLOY_USER=\"${DEPLOY_USER}\" && bundle exec rake rollbar:deploy'" \
            --name 'rollbar-deploy'
