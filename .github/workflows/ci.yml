name: Aixle Insights CI

on: [push, pull_request]

permissions:
  contents: read
  packages: read

jobs:
  # --- API checks (build from source with CI target) ---

  api_test:
    name: API Tests (RSpec)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bash -c "bundle exec rails db:drop db:create db:schema:load && bundle exec rspec"
      container_name: api

  api_lint:
    name: API Lint (Rubocop)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec rubocop --parallel
      container_name: api

  api_security:
    name: API Security (Brakeman)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: bundle exec brakeman --no-pager
      container_name: api

  # --- Web checks ---

  web_test:
    name: Web Tests (Vitest)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run test:run
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_lint:
    name: Web Lint (ESLint)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npm run lint
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  web_typecheck:
    name: Web Typecheck (TypeScript)
    uses: ./.github/workflows/code-check.yml
    secrets: inherit
    with:
      check_command: npx tsc --noEmit
      container_name: web
      docker_compose_file: docker-compose.ci-web.yml

  # --- @aixle/insights (packages/tools/aixle-insights/) ---

  aixle_insights_check:
    name: "@aixle/insights (build + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools
      - name: Test
        run: npm test --workspace=@aixle/insights
        working-directory: packages/tools

  aixle_insights_windows_install:
    name: "@aixle/insights (Windows install smoke — better-sqlite3)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      # Upgrade npm so its bundled node-gyp (12.x+) recognises VS 2025/2026
      # (version "18" in the install path). The default npm on windows-latest
      # ships node-gyp 10.x which reports VS 18.x as "unknown version undefined"
      # and cannot find any VS installation to compile better-sqlite3.
      - name: Upgrade npm (ships node-gyp 12+ with VS 2025/2026 support)
        run: npm install -g npm@latest
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build aixle-insights native dependency
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools
