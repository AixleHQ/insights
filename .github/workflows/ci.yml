name: Aixle Insights CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # --- API checks (Ruby, native runner + service containers) ---

  api_test:
    name: API Tests (RSpec)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries (pg client)
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libpq-dev postgresql-client
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true
          working-directory: packages/api
      - name: Prepare database
        working-directory: packages/api
        run: bundle exec rails db:drop db:create db:schema:load
      - name: RSpec
        working-directory: packages/api
        run: bundle exec rspec

  api_lint:
    name: API Lint (Rubocop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true
          working-directory: packages/api
      - name: Rubocop
        working-directory: packages/api
        run: bundle exec rubocop --parallel

  api_security:
    name: API Security (Brakeman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true
          working-directory: packages/api
      - name: Brakeman
        working-directory: packages/api
        run: bundle exec brakeman --no-pager

  # --- Web checks (Node, native runner) ---

  web_test:
    name: Web Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install
        working-directory: packages/web
        run: npm ci
      - name: Vitest
        working-directory: packages/web
        run: npm run test:run

  web_lint:
    name: Web Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install
        working-directory: packages/web
        run: npm ci
      - name: ESLint
        working-directory: packages/web
        run: npm run lint

  web_typecheck:
    name: Web Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install
        working-directory: packages/web
        run: npm ci
      - name: tsc --noEmit
        working-directory: packages/web
        run: npx tsc --noEmit

  # --- @aixle/insights (packages/tools/aixle-insights/) ---

  aixle_insights_check:
    name: "@aixle/insights (build + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools
      - name: Test
        run: npm test --workspace=@aixle/insights
        working-directory: packages/tools

  aixle_insights_windows_install:
    name: "@aixle/insights (Windows install smoke — better-sqlite3)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
      # Upgrade npm so its bundled node-gyp (12.x+) recognises VS 2025/2026
      # (version "18" in the install path). The default npm on windows-latest
      # ships node-gyp 10.x which reports VS 18.x as "unknown version undefined"
      # and cannot find any VS installation to compile better-sqlite3.
      - name: Upgrade npm (ships node-gyp 12+ with VS 2025/2026 support)
        run: npm install -g npm@latest
      - name: Install workspace
        run: npm ci
        working-directory: packages/tools
      - name: Build aixle-insights native dependency
        run: npm run build --workspace=@aixle/insights
        working-directory: packages/tools
