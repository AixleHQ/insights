name: Reusable Code Check

on:
  workflow_call:
    inputs:
      check_command:
        required: true
        type: string
        description: "Command to run (e.g. 'bundle exec rspec', 'npm run lint')"
      toolbox_image:
        required: false
        type: string
        description: 'Toolbox container image'
        default: 'ghcr.io/artempartos/ecs_toolbox:latest'
      docker_compose_file:
        required: false
        type: string
        description: 'Docker compose file'
        default: 'docker-compose.ci.yml'
      container_name:
        required: false
        type: string
        description: 'Container name to run check in'
        default: 'api'

permissions:
  contents: read
  packages: read

jobs:
  check:
    container: ${{ inputs.toolbox_image }}
    runs-on: self-hosted
    env:
      ENVIRONMENT: test
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export DOCKER_CONFIG for BuildKit
        run: echo "DOCKER_CONFIG=$HOME/.docker" >> "$GITHUB_ENV"

      - name: Run check
        run: |
          docker compose -f ${{ inputs.docker_compose_file }} run --rm ${{ inputs.container_name }} ${{ inputs.check_command }}

      # Container steps run as root; host-native jobs need a writable default workspace.
      - name: Fix workspace permissions
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE"
