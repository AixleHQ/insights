name: Mirror base images to GHCR

# Re-publish upstream Docker Hub images to ghcr.io/dualboot-partners/db90-rails/*
# so self-hosted CI pulls from GHCR (higher rate limits, no Docker Hub account).
#
# After the first successful run, point docker-compose.ci.yml and Dockerfile
# build-args at the mirrored tags. Re-run weekly (or manually) to pick up upstream updates.

on:
  # Runs on feature branches too (GitHub only lists workflow_dispatch in the UI
  # after the file exists on the default branch).
  push:
    paths:
      - .github/workflows/ghcr-mirror-base-images.yml
      - docker/ghcr-mirrors/**
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dualboot-partners/db90-rails

jobs:
  mirror:
    name: Mirror ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: timescaledb
            dockerfile: docker/ghcr-mirrors/timescaledb-pg17.Dockerfile
            tag: latest-pg17
          - id: redis
            dockerfile: docker/ghcr-mirrors/redis-7.Dockerfile
            tag: '7'
          - id: redis-alpine
            dockerfile: docker/ghcr-mirrors/redis-7-alpine.Dockerfile
            tag: 7-alpine
          - id: ruby
            dockerfile: docker/ghcr-mirrors/ruby-3.4.8-slim.Dockerfile
            tag: 3.4.8-slim
          - id: node
            dockerfile: docker/ghcr-mirrors/node-24.13.0-slim.Dockerfile
            tag: 24.13.0-slim
          - id: nginx
            dockerfile: docker/ghcr-mirrors/nginx-alpine.Dockerfile
            tag: alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mirror
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.id }}:${{ matrix.tag }}
          platforms: linux/amd64
