name: Release CLI to npm

on:
  push:
    tags:
      - 'cli-mcp-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - mcp
      version:
        description: 'Version to publish (must equal package.json version; no leading v). Required.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve target package + version
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.target.outputs.package }}
      working_directory: ${{ steps.target.outputs.working_directory }}
      tag_version: ${{ steps.target.outputs.tag_version }}
    steps:
      - id: target
        env:
          REF: ${{ github.ref }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/cli-mcp-v* ]]; then
            RESOLVED_VERSION="${REF#refs/tags/cli-mcp-v}"
          elif [[ -n "$INPUT_PACKAGE" ]]; then
            # workflow_dispatch: require an explicit version input so the
            # package.json-version check below always runs. An empty version
            # here would bypass the guard and allow publishing any version.
            if [[ -z "$INPUT_VERSION" ]]; then
              echo "workflow_dispatch requires a 'version' input." >&2
              exit 1
            fi
            if [[ "$INPUT_PACKAGE" != "mcp" ]]; then
              echo "Only 'mcp' is a valid workflow_dispatch package (got $INPUT_PACKAGE)." >&2
              exit 1
            fi
            RESOLVED_VERSION="$INPUT_VERSION"
          else
            echo "Could not resolve target package from ref=$REF / input=$INPUT_PACKAGE" >&2
            exit 1
          fi

          # Fail closed on a malformed version before anything downstream sees it.
          # The package.json-match guard only proves the two agree — it does not
          # prove either is valid semver, and `npm pack` happily accepts a version
          # like "foo", so a typo'd tag (cli-mcp-vfoo) would otherwise reach the
          # publish step and, having no `-`, be routed to the production channel.
          if [[ ! "$RESOLVED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$RESOLVED_VERSION' is not valid semver (expected X.Y.Z or X.Y.Z-<identifier>)." >&2
            exit 1
          fi

          echo "package=mcp" >> "$GITHUB_OUTPUT"
          echo "working_directory=packages/tools/aixle-insights" >> "$GITHUB_OUTPUT"
          echo "tag_version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.resolve.outputs.package }} to npm
    needs: resolve
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/tools/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Pinned to the 11.x major, NOT @latest. Trusted Publishing needs >= 11.5.1,
      # but npm 12.0.0 (2026-07-08) started blocking package install scripts unless
      # they are covered by its new `allowScripts` config — including during an
      # explicit `npm rebuild`. That silently broke the better-sqlite3 compile step
      # below: it printed "rebuilt dependencies successfully" while compiling
      # nothing, and the failure only surfaced later as a missing .node binding in
      # the test step. Every other pin in this workflow is exact (actions are
      # SHA-pinned), so an unpinned npm was the one place a major could land
      # unannounced. Revisit deliberately when adopting npm 12's allowScripts model.
      - name: Upgrade npm to OIDC-capable version (>= 11.5.1 required for Trusted Publishing)
        run: npm install -g 'npm@^11.5.1'

      - name: Verify version matches package.json
        env:
          TAG_VERSION: ${{ needs.resolve.outputs.tag_version }}
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.working_directory }}
        run: |
          set -euo pipefail
          # Both tag push and workflow_dispatch populate tag_version via the
          # resolve job, so this guard runs for every publish path. No bypass.
          PKG_VERSION=$(node -p "require('./${WORKING_DIRECTORY}/package.json').version")
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "Version mismatch: requested $TAG_VERSION, package.json has $PKG_VERSION" >&2
            exit 1
          fi

      - name: "Reject obsolete-scope placeholders in package source"
        env:
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.working_directory }}
        run: |
          set -euo pipefail
          # Reject the original `@<scope>` placeholder (forward-looking trap
          # for new packages that copy the convention without filling in the
          # scope) and any leftover legacy `@db90/telemetry-mcp` / `db90-mcp` /
          # `db90-telemetry-mcp` strings (catches stragglers from the
          # 2026-06 @db90 → @aixle/insights migration).
          #
          # Scope: scan only files that ship in the npm tarball. Tests +
          # scripts + dev configs are excluded — they intentionally retain
          # legacy strings for shim-behavior assertions and tmp-dir fixtures.
          SCAN_TARGETS=("dist" "README.md" "LICENSE" "package.json" "CHANGELOG.md")
          for needle in '@<scope>' '@db90/telemetry-mcp' 'db90-telemetry-mcp' 'db90-mcp'; do
            # Use -F (fixed-string) so needles are matched literally and never
            # interpreted as regex — future-proofs against needles that happen
            # to contain regex metacharacters.
            for target in "${SCAN_TARGETS[@]}"; do
              full="${WORKING_DIRECTORY}/${target}"
              if [[ -e "$full" ]] && grep -Frn --binary-files=without-match "$needle" "$full"; then
                echo "Found obsolete-scope reference: $needle in $target — block publish." >&2
                exit 1
              fi
            done
          done

      - name: "Reject file:/link: dependencies in package.json"
        env:
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.working_directory }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const pkg = require(`./${process.env.WORKING_DIRECTORY}/package.json`);
          const sections = ['dependencies', 'peerDependencies', 'optionalDependencies'];
          const offenders = [];
          for (const section of sections) {
            for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
              if (typeof spec === 'string' && (spec.startsWith('file:') || spec.startsWith('link:'))) {
                offenders.push(`${section}.${name} = ${spec}`);
              }
            }
          }
          if (offenders.length > 0) {
            console.error('Local-only dependencies cannot be published:');
            for (const o of offenders) console.error('  ' + o);
            process.exit(1);
          }
          EOF

      - name: "Reject unauthorized lifecycle scripts (only prepublishOnly allowed)"
        env:
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.working_directory }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const pkg = require(`./${process.env.WORKING_DIRECTORY}/package.json`);
          const scripts = pkg.scripts || {};
          const allowedLifecycle = new Set(['prepublishOnly']);
          const lifecycleHooks = [
            'preinstall', 'install', 'postinstall',
            'preuninstall', 'uninstall', 'postuninstall',
            'preversion', 'version', 'postversion',
            'prepublish', 'prepare', 'prepack',
            'postpack', 'publish', 'postpublish',
          ];
          const offenders = [];
          for (const hook of lifecycleHooks) {
            if (hook in scripts && !allowedLifecycle.has(hook)) {
              offenders.push(`${hook} = ${scripts[hook]}`);
            }
          }
          if (offenders.length > 0) {
            console.error('Unauthorized lifecycle script(s) in package.json:');
            for (const o of offenders) console.error('  ' + o);
            console.error('Allowed: ' + [...allowedLifecycle].join(', '));
            console.error('If a new lifecycle script is genuinely required, update the packaging guard configuration accordingly.');
            process.exit(1);
          }
          EOF

      - name: "Verify publishConfig.provenance is explicitly false (deferred until repo is public)"
        env:
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.working_directory }}
        run: |
          set -euo pipefail
          # npm rejects provenance attestations from private source repos with
          # HTTP 422 ("Unsupported GitHub Actions source repository visibility:
          # private"). Until dualboot-partners/db90-rails is public, provenance
          # MUST be explicitly false — not missing, not true. The explicit-false
          # form fails fast with this clear message if anyone flips it back to
          # true without first making the repo public.
          #
          # Re-enabling: when the repo goes public, flip this guard to assert
          # === true and set publishConfig.provenance: true in package.json,
          # in the same PR.
          node <<'EOF'
          const pkg = require(`./${process.env.WORKING_DIRECTORY}/package.json`);
          if (pkg.publishConfig?.provenance !== false) {
            console.error('publishConfig.provenance must be explicitly false while the repo is private; got ' + JSON.stringify(pkg.publishConfig));
            console.error('npm rejects provenance attestations from private source repos. See https://docs.npmjs.com/generating-provenance-statements');
            process.exit(1);
          }
          EOF

      - name: Install workspace (block dep lifecycle scripts — defense vs. Shai-Hulud-class postinstall payloads)
        run: npm ci --ignore-scripts
        working-directory: packages/tools

      - name: Verify signatures of installed dependencies
        run: npm audit signatures
        working-directory: packages/tools

      # Explicitly allow ONLY better-sqlite3's install script after the
      # blanket --ignore-scripts above. better-sqlite3 ships a postinstall
      # that runs prebuild-install to download a native .node binding for
      # the current Node version + platform. Without it, vitest tests that
      # touch SQLite crash with "Could not locate the bindings file".
      #
      # `npm rebuild <pkg>` runs the install lifecycle for ONLY that
      # package — every other dep's postinstall stays blocked. Audit
      # signatures already ran above, so the better-sqlite3 tarball was
      # validated before we let any of its code execute.
      - name: Compile better-sqlite3 native binding (surgical allowlist)
        run: npm rebuild better-sqlite3
        working-directory: packages/tools

      # `npm rebuild` exits 0 and prints "rebuilt dependencies successfully" even
      # when it compiled nothing — npm 12 blocked the install script and only
      # emitted a warning. Assert the artifact exists so the failure is attributed
      # here instead of surfacing as a confusing "Could not locate the bindings
      # file" several steps later, and so a future npm change cannot silently
      # reintroduce it.
      - name: Verify the native binding was actually produced
        working-directory: packages/tools
        run: |
          set -euo pipefail
          if ! find node_modules/better-sqlite3 -name 'better_sqlite3.node' -print -quit | grep -q .; then
            echo "better-sqlite3 native binding was not compiled." >&2
            echo "npm rebuild reported success but produced no .node artifact — most likely its" >&2
            echo "install script was blocked (npm >= 12 'allowScripts'). Check the rebuild step log" >&2
            echo "for 'install scripts blocked' warnings, and the pinned npm version above." >&2
            exit 1
          fi
          echo "Found: $(find node_modules/better-sqlite3 -name 'better_sqlite3.node' -print -quit)"

      - name: Build
        run: npm run build
        working-directory: ${{ needs.resolve.outputs.working_directory }}

      - name: Test
        run: npm test
        working-directory: ${{ needs.resolve.outputs.working_directory }}

      - name: Verify pack contents (dist + README + LICENSE)
        working-directory: ${{ needs.resolve.outputs.working_directory }}
        env:
          PACKAGE: ${{ needs.resolve.outputs.package }}
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node <<'EOF'
          const out = require('/tmp/pack.json');
          const allow = new Set(['README.md', 'LICENSE', 'package.json']);
          const paths = out[0].files.map((f) => f.path);
          const leaks = paths.filter(
            (p) => !allow.has(p) && !p.startsWith('dist/'),
          );
          if (leaks.length > 0) {
            console.error("Tarball contains files outside the allowlist (dist/**, README.md, LICENSE, package.json):");
            for (const p of leaks) console.error('  ' + p);
            console.error("Fix the 'files' field in package.json.");
            process.exit(1);
          }
          // SDK is now inlined as src/lib/ (no longer a bundledDependency).
          // The previous fail-closed check for node_modules/@db90/sdk/dist/**
          // is obsolete — there is no separate SDK package to stage.
          EOF

      # npm assigns the 'latest' dist-tag to ANY publish that omits --tag, including
      # prerelease versions. Without this step a staging build (e.g. 0.2.1-staging)
      # would be handed to every `npm install @aixle/insights` user. Derive the tag from
      # the version so it can never be forgotten or passed wrongly by hand:
      #   0.2.0          -> latest    (stable)
      #   0.2.1-staging  -> staging   (QA channel)
      #
      # The model is exactly two channels, so the prerelease identifier is matched
      # exactly rather than prefix-split. Prefix-splitting silently accepted a typo
      # ('0.2.1-stagin.g' -> 'stagin') or an unexpected shape as a brand-new
      # dist-tag that no runbook documents. Anything that is not exactly 'staging'
      # is a mistake in this model, so fail closed and make a human decide —
      # extending to a third channel must be a deliberate change here AND in
      # RELEASING.md, not an accident of tag spelling.
      - name: Resolve npm dist-tag (staging prerelease -> staging, stable -> latest)
        id: disttag
        env:
          TAG_VERSION: ${{ needs.resolve.outputs.tag_version }}
        run: |
          set -euo pipefail
          if [[ "$TAG_VERSION" == *-* ]]; then
            pre="${TAG_VERSION#*-}"
            if [[ "$pre" != "staging" ]]; then
              echo "Unrecognized prerelease identifier '$pre' in version '$TAG_VERSION'." >&2
              echo "This package publishes exactly two channels: X.Y.Z -> latest, X.Y.Z-staging -> staging." >&2
              echo "See packages/tools/RELEASING.md → Release channels. Refusing to publish to an undocumented dist-tag." >&2
              exit 1
            fi
            npm_tag="staging"
          else
            npm_tag="latest"
          fi
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG_VERSION under dist-tag '$npm_tag'"

      - name: Publish to npm (OIDC Trusted Publishing — no stored token)
        working-directory: ${{ needs.resolve.outputs.working_directory }}
        run: npm publish --tag "${{ steps.disttag.outputs.npm_tag }}"
