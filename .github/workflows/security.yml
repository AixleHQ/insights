name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run the gitleaks OSS binary directly (MIT, free for orgs). The
      # gitleaks-action wrapper requires a paid GITLEAKS_LICENSE on org repos.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --no-banner
