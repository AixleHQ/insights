default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: db90_development

test:
  <<: *default
  database: db90_test

staging:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "db90_staging" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "db90" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  sslmode: <%= ENV.fetch("DATABASE_SSLMODE") { "require" } %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "db90_production" } %>
    username: <%= ENV.fetch("DATABASE_USERNAME") { "db90" } %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    sslmode: <%= ENV.fetch("DATABASE_SSLMODE") { "require" } %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "db90_production" } %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "db90_production" } %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "db90_production" } %>_cable
    migrations_paths: db/cable_migrate
