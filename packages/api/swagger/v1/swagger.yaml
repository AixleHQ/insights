        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Repository'
