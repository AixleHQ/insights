  /api/v1/organizations/{organization_id}/stats/tools/{tool_name}/overview:
    get:
      summary: Tool overview stats
      description: Returns aggregate usage stats (events, cost, tokens, active users) for a specific tool. Returns 422 if tool_name is not a recognised value.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            enum: [claude_code, cursor, windsurf, github_copilot, aider, continue, cody, tabnine, amazon_q, openrouter_api, anthropic_api, openai_api, gemini_api, custom, jira, linear, github]
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Tool overview stats for the current month vs previous month
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                    example: cursor
                  total_events:
                    type: integer
                    description: Event count for the current month
                  total_cost_usd:
                    type: number
                    format: float
                    description: Total cost in USD for the current month
                  total_tokens_in:
                    type: integer
                    description: Total input tokens for the current month
                  total_tokens_out:
                    type: integer
                    description: Total output tokens for the current month
                  active_users:
                    type: integer
                    description: Distinct non-null user IDs with events this month
                  events_change_pct:
                    type: number
                    format: float
                    description: Percentage change in events vs previous month (0 if no prior data)
                  cost_change_pct:
                    type: number
                    format: float
                    description: Percentage change in cost vs previous month (0 if no prior data)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organizations/{organization_id}/stats/tools/{tool_name}/models:
    get:
      summary: Tool model breakdown
      description: Returns per-model usage aggregates (event count, tokens, cost) enriched with pricing data. Sorted by eventCount descending. Null-model events are excluded. Defaults to the last 30 days; pass days or start_date/end_date to override.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            enum: [claude_code, cursor, windsurf, github_copilot, aider, continue, cody, tabnine, amazon_q, openrouter_api, anthropic_api, openai_api, gemini_api, custom, jira, linear, github]
        - name: days
          in: query
          description: Number of days to look back (default 30)
          schema:
            type: integer
            default: 30
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Model breakdown for the tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                    example: openrouter_api
                  timeRange:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date-time
                      end:
                        type: string
                        format: date-time
                  models:
                    type: array
                    description: Per-model aggregates sorted by eventCount descending
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: claude-3-5-sonnet-20241022
                        eventCount:
                          type: integer
                        tokensIn:
                          type: integer
                        tokensOut:
                          type: integer
                        costUsd:
                          type: number
                          format: float
                        price_per_million_input:
                          type: number
                          format: float
                          nullable: true
                          description: Input price per million tokens; null if model not in pricing table
                        price_per_million_output:
                          type: number
                          format: float
                          nullable: true
                          description: Output price per million tokens; null if model not in pricing table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organizations/{organization_id}/stats/tools/{tool_name}/users:
    get:
      summary: Tool user breakdown
      description: Returns top users by token consumption for a specific tool, sorted by totalTokens descending. Events without a user_id are excluded.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            enum: [claude_code, cursor, windsurf, github_copilot, aider, continue, cody, tabnine, amazon_q, openrouter_api, anthropic_api, openai_api, gemini_api, custom, jira, linear, github]
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - name: days
          in: query
          required: false
          description: Number of past days to include (ignored when start_date/end_date are provided). Defaults to 30.
          schema:
            type: integer
            default: 30
        - name: limit
          in: query
          required: false
          description: Maximum number of users to return. Clamped between 1 and 100. Defaults to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: User breakdown sorted by totalTokens descending
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                    example: cursor
                  timeRange:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date-time
                      end:
                        type: string
                        format: date-time
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: Alice Chen
                        email:
                          type: string
                          format: email
                          example: alice@company.com
                        eventCount:
                          type: integer
                          example: 214
                        totalTokens:
                          type: integer
                          example: 380000
                        costUsd:
                          type: number
                          format: float
                          example: 6.12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

