---
openapi: 3.0.1
info:
  title: DB90 API V1
  version: v1
  description: API for DB90 - Developer Tooling Platform
  contact:
    name: DB90 Team
servers:
  - url: http://localhost:3001
    description: Development server
  - url: https://api.db90.io
    description: Production server
security:
  - bearer_auth: []

paths:
  # ============================================
  # USER ENDPOINTS
  # ============================================
  /api/v1/users/me:
    get:
      summary: Get current user profile
      tags:
        - Users
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update current user profile
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/me/organizations:
    get:
      summary: Get current user's organizations
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: User's organizations with membership info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationWithMembership'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /api/v1/users/me/settings:
    get:
      summary: Get current user's settings
      tags:
        - Users
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'

  /api/v1/users/me/settings/{key}:
    put:
      summary: Create or update a user setting
      tags:
        - Users
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: object
              required:
                - value
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Setting'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a user setting
      tags:
        - Users
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Setting deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me/personal_settings:
    get:
      summary: Get current user personal alert settings
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Personal settings (defaults returned if no row saved yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserPersonalSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update current user personal alert settings
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - personal_settings
              properties:
                personal_settings:
                  type: object
                  properties:
                    cost_threshold_cents:
                      type: integer
                      nullable: true
                    token_threshold:
                      type: integer
                      nullable: true
                    alert_email:
                      type: boolean
                    alert_slack:
                      type: boolean
      responses:
        '200':
          description: Updated personal settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserPersonalSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/me/favorites:
    get:
      summary: Get current user's favorited projects
      tags:
        - Users
      responses:
        '200':
          description: List of favorited projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # ORGANIZATION ENDPOINTS
  # ============================================
  /api/v1/organizations:
    get:
      summary: List organizations
      description: Returns organizations the current user is a member of (or all for global admins)
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Organizations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create organization
      description: Creates a new organization and makes the current user an owner
      tags:
        - Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: URL-friendly identifier (auto-generated if not provided)
                description:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organizations/{id}:
    get:
      summary: Get organization details
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationFull'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update organization
      description: Requires owner role in the organization
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete organization
      description: Requires owner role in the organization
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Organization deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{id}/retention_policy:
    get:
      summary: Get organization retention policy
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Retention policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationRetentionPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Update organization retention policy
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days:
                  type: integer
                  minimum: 1
                auto_delete_events:
                  type: boolean
                anonymize_after_retention:
                  type: boolean
      responses:
        '200':
          description: Retention policy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationRetentionPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organizations/{id}/retention_preview:
    get:
      summary: Get retention purge preview for an organization
      description: >
        Returns the upcoming purge cutoff date and an estimated count of tool_events
        that will be deleted at the next scheduled purge run.
        The count is computed via a COUNT(*) query gated by a 3-second timeout;
        if the query exceeds the limit, estimatedRecords is null.
        Requires org owner or global admin role.
      tags:
        - Organizations
        - Retention
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/X-Organization-ID'
      responses:
        '200':
          description: Retention preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RetentionPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{id}/settings:
    get:
      summary: Get organization settings
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{id}/settings/{key}:
    put:
      summary: Create or update organization setting
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: object
              required:
                - value
      responses:
        '200':
          description: Setting updated
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete organization setting
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Setting deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{id}/model_pricing:
    get:
      summary: Get model and tool pricing table
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Pricing table (static list prices per million tokens)
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingEntry'
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # MODEL PRICING OVERRIDES ENDPOINTS
  # ============================================
  /api/v1/organizations/{organization_id}/model_pricing/overrides:
    get:
      summary: List per-org model pricing overrides
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
      responses:
        '200':
          description: List of pricing overrides for the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelPricingOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a per-org model pricing override
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPricingOverrideInput'
      responses:
        '201':
          description: Override created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelPricingOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/organizations/{organization_id}/model_pricing/overrides/{id}:
    put:
      summary: Update a per-org model pricing override
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/X-Organization-ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPricingOverrideInput'
      responses:
        '200':
          description: Override updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelPricingOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a per-org model pricing override
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/X-Organization-ID'
      responses:
        '204':
          description: Override deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # ORGANIZATION MEMBERS ENDPOINTS
  # ============================================
  /api/v1/organizations/{organization_id}/members:
    get:
      summary: List organization members
      tags:
        - Organization Members
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, member, viewer]
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMemberListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Add organization member
      description: Requires owner role. Adds a user as a member of the organization.
      tags:
        - Organization Members
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [owner, member, viewer]
              required:
                - user_id
                - role
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organizations/{organization_id}/members/{id}:
    get:
      summary: Get organization member
      tags:
        - Organization Members
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMembership'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update organization member role
      description: Requires owner role. Cannot demote owners unless you are also an owner.
      tags:
        - Organization Members
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [owner, member, viewer]
              required:
                - role
      responses:
        '200':
          description: Member updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove organization member
      description: Requires owner role. Cannot remove owners unless you are also an owner.
      tags:
        - Organization Members
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/members/{id}/dashboard_stats:
    get:
      summary: Personal dashboard stats for a member
      tags:
        - Organization Members
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: id
          in: path
          required: true
          description: Membership ID or user UUID
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Time window (7d, 30d, 90d). Default 30d.
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        '200':
          description: Dashboard stats for the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  total_cost_usd:
                    type: number
                    format: float
                  total_tokens_in:
                    type: integer
                  total_tokens_out:
                    type: integer
                  events_change_percent:
                    type: number
                    format: float
                  cost_change_percent:
                    type: number
                    format: float
                  tokens_change_percent:
                    type: number
                    format: float
                  tool_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                        event_count:
                          type: integer
                        cost_usd:
                          type: number
                          format: float
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organization_id}/members/{id}/prompt_insights:
    get:
      summary: Prompt quality insights for a member
      description: Returns a heuristic prompt quality score and dimension breakdown for the selected period. Self-or-admin only (same access policy as dashboard_stats).
      tags:
        - Organization Members
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: id
          in: path
          required: true
          description: Membership ID or user UUID
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Time window (7d, 30d, 90d). Default 30d.
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        '200':
          description: Prompt insights for the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                    format: float
                    description: Overall quality score 0–10 (1 decimal)
                  dimensions:
                    type: object
                    properties:
                      structure:
                        type: number
                        format: float
                        description: Structure dimension score 0–10
                      context:
                        type: number
                        format: float
                        description: Context dimension score 0–10
                      specificity:
                        type: number
                        format: float
                        description: Specificity dimension score 0–10
                  callouts:
                    type: array
                    description: Empty when no events in period
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [strength, tool, opportunity]
                        label:
                          type: string
                        text:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organization_id}/members/{id}/stats/heatmap:
    get:
      summary: Activity heatmap for a member (last 365 days)
      tags:
        - Organization Members
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: id
          in: path
          required: true
          description: Membership ID or user UUID
          schema:
            type: string
      responses:
        '200':
          description: Daily event counts for heatmap
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    count:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # ORGANIZATION CONNECTORS ENDPOINTS
  # ============================================
  /api/v1/organizations/{organization_id}/connectors:
    get:
      summary: List organization connectors
      tags:
        - Organization Connectors
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: type
          in: query
          description: Filter by connector type
          schema:
            type: string
            enum: [github, gitlab, bitbucket, jira, linear, openrouter, anthropic, openai, gemini]
        - name: active
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Connectors list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationConnector'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create organization connector
      description: Requires owner role. Creates a new connector for the organization.
      tags:
        - Organization Connectors
      parameters:
        - $ref: '#/components/parameters/organization_id'
