          schema:
            type: integer
            default: 30
        - name: period
          in: query
          description: Bucket granularity
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: month
          in: query
          description: Exact calendar month (YYYY-MM). Takes precedence over days.
          schema:
            type: string
            example: '2026-05'
        - name: project_id
          in: query
          description: Scope to a specific project (must belong to this organization)
          schema:
            type: string
      responses:
        '200':
          description: Stats by model
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: One entry per bucket (day or week start); keys are model names + "Other"
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                      additionalProperties:
                        type: integer
                  models:
                    type: array
                    description: Ordered list of model names present in data (top 3 + "Other")
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/stats/tools/{tool_name}/overview:
    get:
      summary: Tool overview stats
      description: Returns aggregate usage stats (events, cost, tokens, active users) for a specific tool. Returns 422 if tool_name is not a recognised value.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            enum: [claude_code, cursor, windsurf, github_copilot, aider, continue, cody, tabnine, amazon_q, openrouter_api, anthropic_api, openai_api, gemini_api, custom, jira, linear, github, gitlab]
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Tool overview stats for the current month vs previous month
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                    example: cursor
                  total_events:
                    type: integer
                    description: Event count for the current month
                  total_cost_usd:
                    type: number
                    format: float
                    description: Total cost in USD for the current month
                  total_tokens_in:
                    type: integer
                    description: Total input tokens for the current month
                  total_tokens_out:
                    type: integer
                    description: Total output tokens for the current month
                  active_users:
                    type: integer
                    description: Distinct non-null user IDs with events this month
                  events_change_pct:
                    type: number
                    format: float
                    description: Percentage change in events vs previous month (0 if no prior data)
                  cost_change_pct:
                    type: number
                    format: float
