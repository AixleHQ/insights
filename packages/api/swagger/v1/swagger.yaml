        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                notification_type:
                  type: string
                  enum: [cost_alert, token_alert, retention_warning, risk_alert]
                recipient_type:
                  type: string
                  enum: [role, user]
                recipient_role:
                  type: string
                  nullable: true
                recipient_user_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Notification route updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationRoute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a notification route
      description: Removes a routing rule. Requires owner role.
      tags:
        - Notification Routes
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Keycloak authentication
    ingest_token_auth:
      type: http
      scheme: bearer
      description: Opaque ingest token issued per UserToolAccount (CLI connectors only)

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    organization_id:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    X-Organization-ID:
      name: X-Organization-ID
      in: header
      required: true
      description: Organization context for the request
      schema:
        type: string
        format: uuid
    X-Organization-ID-Optional:
      name: X-Organization-ID
      in: header
      required: false
      description: |
        Optional organization selector. On MCP token exchange, when present and the
        authenticated user belongs to that organization, ingest accounts are scoped to
        that membership; when omitted, the exchange uses the user's oldest membership.
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    per_page:
      name: per_page
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    start_date:
      name: start_date
      in: query
      description: Start of the time range (ISO 8601 date, e.g. 2026-01-01)
      schema:
        type: string
        format: date
    end_date:
      name: end_date
      in: query
      description: End of the time range (ISO 8601 date, e.g. 2026-01-31)
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    PricingEntry:
      type: object
      properties:
        name:
          type: string
          example: gpt-4o
        input_per_mtok:
          type: number
          format: float
          description: Input price in USD per million tokens
          example: 2.5
        output_per_mtok:
          type: number
          format: float
          description: Output price in USD per million tokens
          example: 10.0
      required:
        - name
        - input_per_mtok
        - output_per_mtok

    ModelPricingOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_pattern:
          type: string
          description: Substring pattern matched against the model name (e.g. "gpt-4o-ft-acme")
          example: gpt-4o-ft-acme
        input_per_mtok:
          type: number
          format: float
          description: Override input price in USD per million tokens
          example: 1.5
        output_per_mtok:
          type: number
          format: float
          description: Override output price in USD per million tokens
          example: 6.0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - model_pattern
        - input_per_mtok
        - output_per_mtok

    ModelPricingOverrideInput:
      type: object
      properties:
        model_pattern:
          type: string
          description: Substring pattern matched against the model name
          example: gpt-4o-ft-acme
        input_per_mtok:
          type: number
          format: float
          description: Override input price in USD per million tokens
          example: 1.5
        output_per_mtok:
          type: number
          format: float
          description: Override output price in USD per million tokens
          example: 6.0
      required:
        - model_pattern
        - input_per_mtok
        - output_per_mtok

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    RateLimitError:
      type: object
      description: |
        Returned with HTTP 429. The `code` field distinguishes rate-limit from quota errors.
        `rate_limit_exceeded` — per-minute request rate exceeded; retry after 60 seconds.
        `quota_exceeded` — monthly event quota reached; retry after `retry_after` seconds (capped at 3600).
      properties:
        error:
          type: string
          example: Rate Limited
        code:
          type: string
          enum: [rate_limit_exceeded, quota_exceeded]
          example: rate_limit_exceeded
        retry_after:
          type: integer
          description: Seconds to wait before retrying. Matches the Retry-After response header.
          example: 60
        quota_resets_at:
          type: string
          format: date-time
          description: ISO8601 timestamp of when the monthly quota resets. Present only when code is quota_exceeded.
          example: "2026-06-01T00:00:00Z"
      required:
        - error
        - code
        - retry_after

    ValidationError:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - error
        - errors

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
      required:
        - currentPage
        - totalPages
        - totalCount
        - perPage

    AuditLogActor:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
      required:
        - id
        - email

    WebhookDelivery:
      type: object
      description: A single webhook delivery tracking record. Captures lifecycle from receipt through sync job completion.
      properties:
        id:
          type: string
          format: uuid
        organizationConnectorId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [github, gitlab, bitbucket, jira, linear, slack]
        eventType:
          type: string
          description: Webhook event type (e.g. push, pull_request, jira:issue_created)
        rawEventKey:
          type: string
          description: MinIO key for the stored raw payload
        status:
          type: string
          enum: [pending, processing, delivered, failed]
        attempts:
          type: integer
          minimum: 0
        lastAttemptedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Error message from the most recent failed attempt
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationAuditLog:
      type: object
      description: Organization-level audit log entry. All fields visible to org admins and global admins.
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: settings.update
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        trackedChanges:
          type: object
          description: JSON diff of before/after values for the audited resource
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
          description: IP address of the actor at the time of the action
        userAgent:
          type: string
          nullable: true
          description: Browser or client user-agent string at the time of the action
        severity:
          type: string
          nullable: true
          enum: [info, warning, critical]
          description: Severity classification of the action
        outcome:
          type: string
          nullable: true
          enum: [success, failure]
          description: Whether the action completed successfully
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditLogActor'
      required:
        - id
        - action
        - trackedChanges
        - metadata
        - ipAddress
        - createdAt

    UnifiedAuditLog:
      type: object
      description: >
        Merged audit log entry sourced from one of three tables: organization audit logs,
        project audit logs, or admin audit logs. The `scope` field identifies the source.
        Admin entries are scoped to actions on this organization or its projects.
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [organization, project, admin]
          description: Source table for this entry
        action:
          type: string
          example: settings.update
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        trackedChanges:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
          enum: [info, warning, critical]
        outcome:
          type: string
          nullable: true
          enum: [success, failure]
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditLogActor'
      required:
        - id
        - scope
        - action
        - trackedChanges
        - metadata
        - createdAt

    RetentionPurgeLog:
      type: object
      description: >
        Tamper-evident record of a data retention purge run.
        Append-only — records are never updated or deleted.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
          description: ID of the organization whose data was purged
        projectId:
          type: integer
          nullable: true
          description: ID of the project (null for org-level purge)
        retentionPolicyType:
          type: string
          enum: [org, project]
          description: Whether the purge was applied at org or project level
        retentionDaysApplied:
          type: integer
          description: Number of retention days used as the window
        cutoffTimestamp:
          type: string
          format: date-time
          description: Datetime before which records were deleted
        recordsDeleted:
          type: integer
          description: Number of records deleted in this run
        jobRunAt:
          type: string
          format: date-time
          description: Datetime when the job ran
        status:
          type: string
          enum: [success, partial, failed]
        errorMessage:
          type: string
          nullable: true
          description: Error details if status is failed or partial
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - retentionPolicyType
        - retentionDaysApplied
        - cutoffTimestamp
        - recordsDeleted
        - jobRunAt
        - status
        - createdAt

    RetentionPreview:
      type: object
      description: >
        Upcoming purge cutoff and estimated tool_events row count (Alba camelCase keys).
      properties:
        cutoffDate:
          type: string
          format: date
          nullable: true
          description: ISO 8601 date before which records will be deleted (null if retention is forever)
        estimatedRecords:
          type: integer
          nullable: true
          description: Estimated number of tool_events to be deleted (null if query timed out)
      required:
        - cutoffDate
        - estimatedRecords

    ProjectAuditLog:
      type: object
      description: >
        Project-level audit log entry.
        `ipAddress`, `trackedChanges`, and `userAgent` are omitted (key absent, not null) for
        project-admin callers who are not org admins. Org admins and global admins receive all fields.
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: settings.update
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        trackedChanges:
          type: object
          description: JSON diff of before/after values. Omitted for project-admin callers (non-org-admin).
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
          description: IP of the actor at action time. Omitted for project-admin callers (non-org-admin).
        userAgent:
          type: string
          nullable: true
          description: Browser or client user-agent string. Omitted for project-admin callers (non-org-admin).
        severity:
          type: string
          nullable: true
          enum: [info, warning, critical]
          description: Severity classification of the action
        outcome:
          type: string
          nullable: true
          enum: [success, failure]
          description: Whether the action completed successfully
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditLogActor'
      required:
        - id
        - action
        - metadata
        - createdAt

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        globalAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
