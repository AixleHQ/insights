    ToolEvent:
      type: object
      description: Tool event as returned by the list endpoint
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        projectId:
          type: string
          format: uuid
          nullable: true
        toolName:
          type: string
        eventType:
          type: string
        model:
          type: string
          nullable: true
        costUsd:
          type: number
          format: float
          nullable: true
        durationMs:
          type: integer
          nullable: true
        inputTokens:
          type: integer
          nullable: true
        outputTokens:
          type: integer
          nullable: true
        costCents:
          type: integer
          nullable: true
        riskLevel:
          type: string
          enum: [critical, high, medium, low, none]
        attribution:
          type: string
          enum: [user, organization, unknown]
        correlationMethod:
          type: string
          nullable: true
          description: Method used (or attempted) to correlate the event to a user (e.g. "email", "machine_id", "manual")
        correlationConfidence:
          type: number
          format: float
          nullable: true
          description: Confidence score (0.0–1.0) for the best correlation attempt
        securityFindings:
          type: array
          items:
            type: object
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            name:
              type: string
              nullable: true
        project:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
      required:
        - id
        - organizationId
        - toolName
        - eventType
        - riskLevel
        - attribution
        - occurredAt
        - createdAt

    ToolEventDetail:
      description: Tool event as returned by the detail endpoint (includes metadata and audit log)
      allOf:
        - $ref: '#/components/schemas/ToolEvent'
        - type: object
          properties:
            metadata:
              type: object
              nullable: true
              additionalProperties: true
            project:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                slug:
                  type: string
            auditLog:
              nullable: true
              $ref: '#/components/schemas/AuditLog'

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        toolEventId:
          type: string
          format: uuid
        riskLevel:
          type: string
          nullable: true
        temporalWorkflowId:
          type: string
          nullable: true
        rawEventKey:
          type: string
          nullable: true
        confidenceScore:
          type: number
          format: float
          nullable: true
        classificationLabels:
          type: array
          nullable: true
          items:
            type: string
        sanitizationActions:
          type: array
          nullable: true
          items:
            type: string
        highRisk:
          type: boolean
        detectionSummary:
          type: object
          nullable: true
        sanitizationChanges:
          type: object
          nullable: true
        riskScore:
          type: number
          format: float
          nullable: true
        policyVersion:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            version:
              type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - toolEventId
        - highRisk
        - createdAt

