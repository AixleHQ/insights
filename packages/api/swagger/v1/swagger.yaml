  # ============================================
  # PROJECT LOOKUP (ingest token auth)
  # ============================================
  /api/v1/projects/lookup:
    get:
      summary: Look up project by git remote URL
      description: >
        Returns a project matching the given git remote URL, scoped to projects
        accessible by the ingest token's user (org projects + personal projects).
        URL is normalized (lowercased, `.git` suffix stripped, whitespace trimmed)
        before lookup. SSH and HTTPS variants are not interchangeable — the stored
        value must match the exact protocol form of `git remote get-url origin`.
        Used by CLI connectors for automatic project attribution.
      tags:
        - Projects
      security:
        - ingest_token_auth: []
      parameters:
        - name: git_remote
          in: query
          required: true
          description: Git remote URL (e.g. git@github.com:org/repo.git)
          schema:
            type: string
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project_id:
                        type: string
                        format: uuid
                      name:
                        type: string
                    required:
                      - project_id
                      - name
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # PROJECT ENDPOINTS
  # ============================================
  /api/v1/projects:
    get:
      summary: List projects
      description: Returns all projects the user can access (personal + organization projects)
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: personal
          in: query
          description: Filter to personal projects only
          schema:
            type: string
            enum: ['true', 'false']
        - name: active
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create personal project
      description: Creates a new personal project owned by the current user
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                git_remote_url:
                  type: string
                  nullable: true
                  description: Git remote URL used by CLI connectors for auto-detection (e.g. git@github.com:org/repo.git)
              required:
                - name
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================
  # ORGANIZATION AUDIT LOG ENDPOINTS
  # ============================================
  /api/v1/organizations/{organization_id}/audit_logs:
    get:
      summary: List organization audit logs
      description: >
        Returns paginated audit log entries for the organization.
        Requires org admin or global admin role. Members receive 403.
        All fields including `ipAddress` and `trackedChanges` are included.
      tags:
        - Organization Audit Logs
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: actor_id
          in: query
          description: Filter by actor user ID
          schema:
            type: string
            format: uuid
        - name: log_action
          in: query
          description: Filter by action (e.g. settings.update, member.removed)
          schema:
            type: string
        - name: resource_type
          in: query
          description: Filter by resource type (e.g. OrganizationConnector)
          schema:
            type: string
        - name: from_date
          in: query
          description: Filter entries on or after this ISO 8601 datetime
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Filter entries on or before this ISO 8601 datetime
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationAuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/audit_logs/unified:
    get:
      summary: Unified audit log across all three scopes
      description: >
        Returns a merged, paginated audit log timeline for the organization, combining
        organization-level, project-level, and admin audit entries. Results are sorted
        by `createdAt` DESC across all three source tables (Ruby-level merge, not SQL UNION).

        Each entry includes a `scope` field indicating its source table. Admin logs are
        filtered to actions directly on this organization (`resource_type=Organization`) or
        on any project belonging to it (`resource_type=Project`).

        **Performance note:** each source table is capped at 1 000 records per request.
        Use `scope`, `from`/`to`, `severity`, or `outcome` to narrow results when dealing
        with high-volume audit trails.

        Requires org owner or global admin role.
      tags:
        - Organization Audit Logs
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: scope
          in: query
          description: Limit results to one source table. Omit to include all three.
          schema:
            type: string
            enum: [organization, project, admin]
        - name: actor_id
          in: query
          description: Filter by actor user ID (maps to actor_id for org/project logs and admin_user_id for admin logs)
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          description: Filter by severity level
          schema:
            type: string
            enum: [info, warning, critical]
        - name: outcome
          in: query
          description: Filter by outcome
          schema:
            type: string
            enum: [success, failure]
        - name: from
          in: query
          description: Filter entries on or after this ISO 8601 datetime (alias from_date accepted)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter entries on or before this ISO 8601 datetime (alias to_date accepted)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated unified audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnifiedAuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/audit_logs/unified/export:
    get:
      summary: Export unified audit log as CSV
      description: >
        Exports filtered audit log entries as CSV (up to 50,000 rows per source table).
        Returns 422 if the result set exceeds that limit — apply date or scope filters to narrow results.
        Note: tracked_changes and metadata columns are not included in the CSV export.
        Requires org owner or global admin role.
      tags:
        - Organization Audit Logs
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: scope
          in: query
          description: Limit results to one source table. Omit to include all three.
          schema:
            type: string
            enum: [organization, project, admin]
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, critical]
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: from_date
          in: query
          description: Filter entries on or after this ISO 8601 datetime (alias from accepted)
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Filter entries on or before this ISO 8601 datetime (alias to accepted)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Export row limit exceeded (50,000 rows per source table) — apply date or scope filters to narrow results
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Export exceeds row limit. Apply date or scope filters to narrow results."

  /api/v1/organizations/{organization_id}/retention_logs:
    get:
      summary: List retention purge logs for an organization
      description: >
        Returns paginated records of data purge runs for the organization.
        Each record contains the retention window applied, cutoff timestamp,
        number of records deleted, and the run status.
        Requires org owner or global admin role. Other roles receive 403.
      tags:
        - Retention
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Paginated retention purge log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RetentionPurgeLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/webhook_deliveries:
    get:
      summary: List webhook deliveries
      description: >
        Returns paginated webhook delivery history for the organization.
        Requires org admin or global admin role. Filterable by status, provider, and date range.
      tags:
        - Webhook Deliveries
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: status
          in: query
          description: Filter by delivery status
          schema:
            type: string
            enum: [pending, processing, delivered, failed]
        - name: provider
          in: query
          description: Filter by provider
          schema:
            type: string
            enum: [github, gitlab, bitbucket, jira, linear, slack]
        - name: date_from
          in: query
          description: Filter deliveries created on or after this ISO 8601 datetime
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Filter deliveries created on or before this ISO 8601 datetime
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated webhook delivery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/webhook_deliveries/{id}/retry:
    post:
      summary: Retry a failed webhook delivery
      description: >
        Re-enqueues a failed webhook delivery using the stored raw payload from MinIO.
        Only allowed for deliveries with status "failed". Returns 422 if the delivery
        is not in a failed state or if the raw payload has expired (MinIO TTL).
      tags:
        - Webhook Deliveries
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: id
          in: path
          required: true
          description: Webhook delivery UUID
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Delivery re-enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Delivery is not retryable (not failed, or payload expired)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

