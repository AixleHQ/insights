---
openapi: 3.0.1
info:
  title: DB90 API V1
  version: v1
  description: API for DB90 - Developer Tooling Platform
  contact:
    name: DB90 Team
paths:
  /api/v1/organizations/{organization_id}/members/{id}/dashboard_stats:
    get:
      summary: Personal dashboard stats for a member
      tags:
        - Members
      security:
        - bearer_auth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Membership ID or user UUID
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Time window (7d, 30d, 90d). Default 30d.
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        '200':
          description: Dashboard stats for the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  total_cost_usd:
                    type: number
                    format: float
                  total_tokens_in:
                    type: integer
                  total_tokens_out:
                    type: integer
                  events_change_percent:
                    type: number
                    format: float
                  cost_change_percent:
                    type: number
                    format: float
                  tokens_change_percent:
                    type: number
                    format: float
                  tool_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                        event_count:
                          type: integer
                        cost_usd:
                          type: number
                          format: float
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Member not found
  /api/v1/organizations/{organization_id}/members/{id}/stats/heatmap:
    get:
      summary: Activity heatmap for a member (last 365 days)
      tags:
        - Members
      security:
        - bearer_auth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Membership ID or user UUID
          schema:
            type: string
      responses:
        '200':
          description: Daily event counts for heatmap
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    count:
                      type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Member not found
servers:
- url: http://localhost:3001
  description: Development server
- url: https://api.db90.io
  description: Production server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Keycloak authentication
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
    ValidationError:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - error
      - errors
    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
      required:
      - currentPage
      - totalPages
      - totalCount
      - perPage
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        globalAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - email
      - globalAdmin
      - createdAt
      - updatedAt
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - slug
      - isActive
      - createdAt
      - updatedAt
    OrganizationMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - member
          - viewer
        user:
          "$ref": "#/components/schemas/UserMinimal"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - organizationId
      - role
      - user
      - createdAt
      - updatedAt
    OrganizationConnector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        connectorType:
          type: string
          enum:
          - github
          - gitlab
          - bitbucket
          - jira
          - linear
          - openrouter
          - anthropic
          - openai
          - gemini
        isActive:
          type: boolean
        externalAccountId:
          type: string
          nullable: true
        externalAccountName:
          type: string
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        tokenExpired:
          type: boolean
        sourceControl:
          type: boolean
        projectManagement:
          type: boolean
        aiProvider:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - organizationId
      - connectorType
      - isActive
      - createdAt
      - updatedAt
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        organizationId:
          type: string
          format: uuid
          nullable: true
        ownerId:
          type: string
          format: uuid
          nullable: true
        isPersonal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - slug
      - isActive
      - isPersonal
      - createdAt
      - updatedAt
    Repository:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        organizationConnectorId:
          type: string
          format: uuid
        externalId:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
          nullable: true
        defaultBranch:
          type: string
          nullable: true
        cloneUrl:
          type: string
          nullable: true
        htmlUrl:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        provider:
          type: string
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        needsSync:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectId
      - organizationConnectorId
      - externalId
      - name
      - fullName
      - isPrivate
      - provider
      - createdAt
      - updatedAt
    UserMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
      - id
      - email
    OrganizationRetentionPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        retentionDays:
          type: integer
        autoDeleteEvents:
          type: boolean
        anonymizeAfterRetention:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - organizationId
      - retentionDays
      - autoDeleteEvents
      - anonymizeAfterRetention
      - createdAt
      - updatedAt
    Setting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - key
      - value
      - createdAt
      - updatedAt
security:
- bearer_auth: []
