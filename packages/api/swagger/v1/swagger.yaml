        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: private
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Repositories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Repository'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Add repository to project
      description: Requires admin role in the project
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/project_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_connector_id:
                  type: string
                  format: uuid
                external_id:
                  type: string
                name:
                  type: string
                full_name:
                  type: string
                description:
                  type: string
                default_branch:
                  type: string
                clone_url:
                  type: string
                html_url:
                  type: string
                is_private:
                  type: boolean
              required:
                - organization_connector_id
                - external_id
                - name
                - full_name
      responses:
        '201':
          description: Repository added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Repository'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/repositories/{id}:
    get:
      summary: Get repository details
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Repository'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update repository
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                default_branch:
                  type: string
      responses:
        '200':
          description: Repository updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove repository from project
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Repository removed
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{project_id}/repositories/{id}/sync:
    post:
      summary: Trigger repository sync
      description: Triggers a sync operation for the repository
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Repository'
        '403':
          $ref: '#/components/responses/Forbidden'

# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Keycloak authentication

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    organization_id:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    X-Organization-ID:
      name: X-Organization-ID
      in: header
      required: true
      description: Organization context for the request
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    per_page:
      name: per_page
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    start_date:
      name: start_date
      in: query
      description: Start of the time range (ISO 8601 date, e.g. 2026-01-01)
      schema:
        type: string
        format: date
    end_date:
      name: end_date
      in: query
      description: End of the time range (ISO 8601 date, e.g. 2026-01-31)
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    ValidationError:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - error
        - errors

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
      required:
        - currentPage
        - totalPages
        - totalCount
        - perPage

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        globalAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - globalAdmin
        - createdAt
        - updatedAt

    UserMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isActive
        - createdAt
        - updatedAt

    OrganizationFull:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          properties:
            retentionPolicy:
              $ref: '#/components/schemas/OrganizationRetentionPolicy'
            memberCount:
              type: integer
            projectCount:
              type: integer

    OrganizationWithMembership:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          properties:
            userRole:
              type: string
              enum: [owner, admin, member, viewer]

    OrganizationMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, viewer]
        user:
          $ref: '#/components/schemas/UserMinimal'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - role
        - user
        - createdAt
        - updatedAt

    OrganizationConnector:
      type: object
      description: Connector credentials (tokens are never exposed in responses)
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        connectorType:
          type: string
          enum: [github, gitlab, bitbucket, jira, linear, openrouter, anthropic, openai, gemini]
        isActive:
          type: boolean
        externalAccountId:
          type: string
          nullable: true
        externalAccountName:
          type: string
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        tokenExpired:
          type: boolean
        sourceControl:
          type: boolean
        projectManagement:
          type: boolean
        aiProvider:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - connectorType
        - isActive
        - createdAt
        - updatedAt

    OrganizationRetentionPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        retentionDays:
          type: integer
        autoDeleteEvents:
          type: boolean
        anonymizeAfterRetention:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - retentionDays
        - autoDeleteEvents
        - anonymizeAfterRetention
        - createdAt
        - updatedAt

    UserToolAccount:
      type: object
      description: User's tool account (tokens are never exposed in responses)
      properties:
        id:
          type: string
          format: uuid
        organizationMembershipId:
          type: string
          format: uuid
        toolName:
          type: string
          enum: [claude_code, cursor, windsurf, github_copilot, aider, continue, cody, tabnine, amazon_q, openrouter_api, anthropic_api, openai_api, gemini_api, custom]
        isActive:
          type: boolean
        externalAccountId:
          type: string
          nullable: true
        externalAccountName:
          type: string
          nullable: true
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        tokenExpired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationMembershipId
        - toolName
        - isActive
        - createdAt
        - updatedAt

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        organizationId:
          type: string
          format: uuid
          nullable: true
        ownerId:
          type: string
          format: uuid
          nullable: true
        isPersonal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isActive
        - isPersonal
        - createdAt
        - updatedAt

    ProjectFull:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            organization:
              $ref: '#/components/schemas/OrganizationMinimal'
            owner:
              $ref: '#/components/schemas/UserMinimal'
            memberCount:
              type: integer
            repositoryCount:
              type: integer

    OrganizationMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    ProjectMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, viewer]
        user:
          $ref: '#/components/schemas/UserMinimal'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - role
        - user
        - createdAt
        - updatedAt

    Repository:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        organizationConnectorId:
          type: string
          format: uuid
        externalId:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
          nullable: true
        defaultBranch:
          type: string
          nullable: true
        cloneUrl:
          type: string
          nullable: true
        htmlUrl:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        provider:
          type: string
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        needsSync:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - organizationConnectorId
        - externalId
        - name
        - fullName
        - isPrivate
        - provider
        - createdAt
        - updatedAt

    Setting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - key
        - value
        - createdAt
        - updatedAt
