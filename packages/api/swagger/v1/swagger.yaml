  # ============================================
  # PROJECT AUDIT LOG ENDPOINTS
  # ============================================
  /api/v1/projects/{project_id}/audit_logs:
    get:
      summary: List project audit logs
      description: >
        Returns paginated audit log entries for the project.
        Accessible by project admins (owner/admin role on the project), org admins, and global admins.
        Project members and viewers receive 403.

        **Role-based field visibility:**
        - Org admins and global admins: all fields including `ipAddress` and `trackedChanges`
        - Project admins (non-org-admin): `ipAddress` and `trackedChanges` are omitted from the response
        - Personal project owners: all fields included
      tags:
        - Project Audit Logs
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: actor_id
          in: query
          description: Filter by actor user ID
          schema:
            type: string
            format: uuid
        - name: log_action
          in: query
          description: Filter by action (e.g. settings.update, member.removed)
          schema:
            type: string
        - name: resource_type
          in: query
          description: Filter by resource type (e.g. ProjectConnector)
          schema:
            type: string
        - name: from_date
          in: query
          description: Filter entries on or after this ISO 8601 datetime
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Filter entries on or before this ISO 8601 datetime
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectAuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # PROJECT MEMBERS ENDPOINTS
  # ============================================
  /api/v1/projects/{project_id}/members:
    get:
