  # ============================================
  # STATS ENDPOINTS
  # ============================================
  /api/v1/organizations/{organization_id}/stats/overview:
    get:
      summary: Organization stats overview
      description: Returns aggregate event count, cost, active users, and risk alert count for the current month, with percentage change vs the previous month. Pass project_id to scope all counts to a single project.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: project_id
          in: query
          description: Scope stats to a specific project (must belong to this organization)
          schema:
            type: string
      responses:
        '200':
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  total_cost_usd:
                    type: number
                    format: float
                  risk_alerts:
                    type: integer
                    description: Count of distinct tool_events with at least one non-none audit log in the current month
                  active_users:
                    type: integer
                  events_change_percent:
                    type: number
                    format: float
                  cost_change_percent:
                    type: number
                    format: float
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organization_id}/stats/hourly:
    get:
      summary: Hourly stats
      description: Returns per-hour event counts, token totals, cost, and unique users. Defaults to the last 24 hours; override with start_date/end_date.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Hourly stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      timeRange:
                        type: object
                        properties:
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
                      hourly:
                        type: array
                        items:
                          type: object
                          properties:
                            hour:
                              type: string
                              format: date-time
                            eventCount:
                              type: integer
                            tokensIn:
                              type: integer
                            tokensOut:
                              type: integer
                            costUsd:
                              type: number
                              format: float
                            uniqueUsers:
                              type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/stats/daily:
    get:
      summary: Daily stats
      description: Returns daily event counts and cost, plus a per-tool breakdown. Defaults to the last 30 days; pass `days` to override.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: days
          in: query
          description: Number of days to look back (default 30)
          schema:
            type: integer
            default: 30
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Daily stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        event_count:
                          type: integer
                        cost_usd:
                          type: number
                          format: float
                  tool_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                        event_count:
                          type: integer
                        cost_usd:
                          type: number
                          format: float
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/stats/daily_by_tool:
    get:
      summary: Daily stats by tool
      description: Returns event counts grouped by the top 3 tools plus an "Other" bucket — shaped for stacked bar charts. Granularity is day (default) or week. Use month (YYYY-MM) or days to set the window.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: days
          in: query
          description: Rolling window in days (default 30). Ignored when month is present.
          schema:
            type: integer
            default: 30
        - name: period
          in: query
          description: Bucket granularity
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: month
          in: query
          description: Exact calendar month to query (YYYY-MM). Takes precedence over days.
          schema:
            type: string
            example: '2026-05'
        - name: project_id
          in: query
          description: Scope to a specific project (must belong to this organization)
          schema:
            type: string
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Stats by tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: One entry per bucket (day or week start); keys are tool names + "Other"
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                      additionalProperties:
                        type: integer
                  tools:
                    type: array
                    description: Ordered list of tool names present in data (top 3 + "Other")
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/stats/heatmap:
    get:
      summary: Activity heatmap
      description: Returns daily event counts for the past year, shaped for a calendar heatmap.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
      responses:
        '200':
          description: Heatmap data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    count:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/stats/risk_alerts:
    get:
      summary: Risk alerts by tool
      description: |
        Returns tool-grouped events that have at least one audit log with risk_level != 'none' in the given window.
        Uses a subquery to prevent SUM inflation from the ToolEvent has_many :audit_logs relation.
        The SUM(eventCount) across rows approximates the risk_alerts value in /stats/overview when both use the same window.
      tags:
        - Stats
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/X-Organization-ID'
        - name: days
          in: query
          description: Rolling window in days (default 30). Ignored when month is present.
          schema:
            type: integer
            default: 30
        - name: month
          in: query
          description: Exact calendar month (YYYY-MM). Takes precedence over days.
          schema:
            type: string
            example: '2026-05'
        - name: project_id
          in: query
          description: Scope to a specific project (must belong to this organization)
          schema:
            type: string
      responses:
        '200':
          description: Risk alert rows sorted by event count descending
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    toolName:
                      type: string
                    eventCount:
                      type: integer
                    tokensIn:
                      type: integer
                    tokensOut:
                      type: integer
                    costUsd:
                      type: number
                      format: float
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organization_id}/stats/daily_by_model:
    get:
      summary: Daily stats by model
      description: Returns event counts grouped by the top 3 AI models plus an "Other" bucket. Granularity is day (default) or week. Use month (YYYY-MM) or days to set the window.
      tags:
        - Stats
