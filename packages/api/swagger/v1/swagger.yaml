          $ref: '#/components/responses/Forbidden'

  # ============================================
  # EVENTS
  # ============================================
  /api/v1/organizations/{organization_id}/events:
    get:
      summary: List events
      description: Returns a paginated list of tool events for the organization. Supports filtering by tool, event type, risk level, user, project, model, and date range.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - name: tool_name
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - name: risk_level
          in: query
          description: |
            Filter by cost-based risk tier. `not_none` is a convenience alias for `cost_usd > 0.01`
            (any non-zero risk). Note: this is cost-based risk; AuditLog risk (content scanning) is a
            separate signal available via /stats/risk_alerts.
          schema:
            type: string
            enum: [critical, high, medium, low, none, not_none]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: model
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/events/{id}:
    get:
      summary: Get event details
      description: Returns full details for a single tool event, including metadata, audit log, and associations.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ToolEventDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organization_id}/events/summary:
    get:
      summary: Event summary statistics
      description: Returns aggregate counts (events, tokens, cost) grouped by tool, event type, and user.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
      responses:
        '200':
          description: Summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalEvents:
                        type: integer
                      totalTokensIn:
                        type: integer
                      totalTokensOut:
                        type: integer
                      totalCostUsd:
                        type: number
                        format: float
                      byTool:
                        type: object
                        additionalProperties:
                          type: integer
                      byEventType:
                        type: object
                        additionalProperties:
                          type: integer
                      byUser:
                        type: object
                        additionalProperties:
                          type: integer
                      timeRange:
                        type: object
                        properties:
                          start:
                            type: string
                            format: date-time
                            nullable: true
                          end:
                            type: string
                            format: date-time
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/events/unattributed:
    get:
      summary: List unattributed events
      description: >
        Returns events with no assigned user (user_id is null). Restricted to org admins and above.
        Each event includes correlation_method and correlation_confidence from metadata (populated by
        AttributionJob when a candidate was found but below the confidence threshold).
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - name: tool_name
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - name: min_confidence
          in: query
          description: Filter to events where the best-attempt correlation_confidence is at least this value (0.0–1.0). Events never processed by AttributionJob are excluded when this filter is active.
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
      responses:
        '200':
          description: Paginated list of unattributed events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{organization_id}/events/{id}/attribute:
    post:
      summary: Manually attribute an event to a user
      description: >
        Assigns a user to an unattributed event. Sets correlation_method to "manual" and
        correlation_confidence to 1.0 in metadata. Restricted to org admins and above.
        The action is audit-logged.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
