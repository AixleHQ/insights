            type: string
            enum: [owner, member, viewer]
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMemberListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Add project member
      description: Requires organization owner (or personal project owner) for org projects
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [owner, member, viewer]
              required:
                - user_id
                - role
      responses:
        '201':
          description: Member added
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/members/stats:
    get:
      summary: Get per-member usage stats for a project
      description: Returns usage statistics for all project members in the given time window. Restricted to project owners and org owners.
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
        - name: days
          in: query
          schema:
            type: integer
            default: 30
          description: Number of days to look back (default 30)
      responses:
        '200':
          description: Per-member stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                        name:
                          type: string
                          nullable: true
                        role:
                          type: string
                          enum: [owner, member, viewer]
                        eventCount:
                          type: integer
                        inputTokens:
                          type: integer
                        outputTokens:
                          type: integer
                        costUsd:
                          type: number
                          format: float
                        lastEventAt:
                          type: string
                          format: date-time
                          nullable: true
                        primaryTool:
                          type: string
                          nullable: true
                      required:
                        - userId
                        - email
                        - role
                        - eventCount
                        - inputTokens
                        - outputTokens
                        - costUsd
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{project_id}/members/{id}:
    get:
      summary: Get project member
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembership'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update project member role
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [owner, member, viewer]
              required:
                - role
      responses:
        '200':
          description: Member updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove project member
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{project_id}/members/{id}/breakdown:
    get:
      summary: Project-scoped member activity breakdown
      description: |
        Detailed tool and model breakdown for a single project member. All metrics are scoped to `tool_events` for this project only
        (events from other projects are excluded). Path `id` may be project membership id or member user UUID.
      tags:
        - Project Members
      parameters:
        - $ref: '#/components/parameters/project_id'
        - name: id
          in: path
          required: true
          description: Project membership ID or member user UUID
          schema:
            type: string
      responses:
        '200':
          description: Member stats for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberStats'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
