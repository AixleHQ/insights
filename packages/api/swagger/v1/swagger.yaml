  # ============================================
  # OPENROUTER WEBHOOK
  # ============================================
  /api/v1/webhooks/openrouter_traces:
    post:
      summary: Receive OpenRouter Broadcast Webhook OTLP traces
      description: |
        Public endpoint that receives per-request telemetry from OpenRouter's
        Broadcast Webhook feature (Settings > Observability > Webhook).

        OpenRouter sends an OTLP JSON payload after each API call made through a
        connected account. The connector is resolved via the SHA-256 hash of the
        API key embedded as a span attribute (`openrouter.api_key_hash`).

        Optional HMAC verification: if `connector.webhook_secret` is set, the
        request must include a matching `X-Openrouter-Signature` header
        (HMAC-SHA256 of the raw body).

        Returns 200 for test-connection requests (`X-Test-Connection: true`),
        202 for accepted payloads, and 200 when the connector is not found
        (to prevent OpenRouter from retrying unknown-account payloads).
      tags:
        - Webhooks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: OTLP resourceSpans envelope
              properties:
                resourceSpans:
                  type: array
                  items:
                    type: object
                    properties:
                      resource:
                        type: object
                      scopeSpans:
                        type: array
                        items:
                          type: object
                          properties:
                            spans:
                              type: array
                              items:
                                type: object
                                properties:
                                  traceId:
                                    type: string
                                  spanId:
                                    type: string
                                  name:
                                    type: string
                                  startTimeUnixNano:
                                    type: string
                                  endTimeUnixNano:
                                    type: string
                                  attributes:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        key:
                                          type: string
                                        value:
                                          type: object
      responses:
        '200':
          description: Test connection acknowledged or connector not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '202':
          description: Trace accepted and queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integrations/mcp/exchange:
    post:
      summary: Exchange Keycloak access token for MCP ingest token(s)
      description: |
        Mints fresh `UserToolAccount` ingest token(s) for the JWT-authenticated user
        and the requested ingest tool(s). Accounts are scoped to one of the caller's
        organization memberships: use optional header **`X-Organization-ID`** to pick a
        specific org the user belongs to; when that header is omitted, the exchange uses
        the user's oldest membership (by `organization_memberships.created_at`). Call with
        `Authorization: Bearer` carrying the Keycloak access token from RFC 8628 device
        authorization.

        Pass **`tool_name`** for a legacy single-account exchange, **or**
        **`tools`** to rotate/create multiple connectors in one request (atomic under
        a membership advisory lock).

        Responses always include **`accounts`** with per-tool `ingestToken` entries.
        When exactly one tool is provisioned the payload also echoes flat
        **`ingestToken`** + **`toolName`** for MCP clients expecting the original shape.
      tags:
        - Integrations
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/X-Organization-ID-Optional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    tool_name:
                      type: string
                      enum: [claude_code, cursor]
                    device_label:
                      type: string
                      description: Optional client context (not persisted in this version)
                  required:
                    - tool_name
                - type: object
                  properties:
                    tools:
                      type: array
                      description: Duplicate tools are stripped server-side via `uniq`
                      minItems: 1
                      items:
                        type: string
                        enum: [claude_code, cursor]
                    device_label:
                      type: string
                      description: Optional client context (not persisted in this version)
                  required:
                    - tools
            examples:
              single_legacy:
                summary: Legacy single-token exchange
                value:
                  tool_name: claude_code
                  device_label: db90-dev
              multi:
                summary: Dual-token MCP install
                value:
                  tools: [claude_code, cursor]
                  device_label: db90-mcp
      responses:
        '201':
          description: Ingest token(s) minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ingestToken:
                        type: string
                        description: Duplicate of the lone tool token — present only when provisioning a single ingest account
                      toolName:
                        type: string
                        enum: [claude_code, cursor]
                        description: Echoed ingest tool identifier when only one token is rotated
                      accounts:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            ingestToken:
                              type: string
                          required:
                            - ingestToken
                      ingestHost:
                        type: string
                        format: uri
                      organizationId:
                        type: string
                    required:
                      - ingestHost
                      - organizationId
                      - accounts
                required:
                  - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden — no usable organization membership, user is not a member of the
            organization given in `X-Organization-ID`, or `UserToolAccountPolicy` denied
            create for the resolved membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================
  # INGEST ENDPOINT (ingest token auth)
  # ============================================
  /api/v1/ingest/events:
    post:
      summary: Ingest a tool event
      description: |
        Accepts a single tool-usage event from a CLI connector (`db90-claude`, `db90-cursor`).
        Authenticated with a per-`UserToolAccount` Bearer ingest token (not a Keycloak JWT).

        The endpoint also accepts raw Claude Code hook payloads (`PostToolUse` and `Stop`),
        which are mapped to structured events server-side.

        On success the event is stored in MinIO and queued for sanitization via a Temporal
        workflow. A `202 Accepted` is returned immediately — the event may not be persisted
        to `tool_events` yet.

        **Rate limiting:** Each organization is limited to 1,000 events/minute by default
        (configurable per org via `OrganizationSetting`). Excess requests receive `429` with
        a `Retry-After: 60` header.

        **Monthly quota:** Organizations may have a monthly event quota set. Once the quota
        is reached, all further requests return `429` with `code: "quota_exceeded"` until the
        next calendar month.
      tags:
        - Ingest
      security:
        - ingest_token_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Standard event payload. Also accepts raw Claude Code hook payloads
                (`session_id` + `tool_input`/`tool_response` for PostToolUse, or
                `session_id` + `stop_hook_active` for Stop hooks).
              properties:
                event_type:
                  type: string
                  example: completion
                model:
                  type: string
                  example: claude-3-5-sonnet
                tokens_in:
                  type: integer
                  example: 1024
                tokens_out:
                  type: integer
                  example: 512
                tokens_total:
                  type: integer
                  example: 1536
                cost_usd:
                  type: number
                  format: float
                  example: 0.0042
                duration_ms:
                  type: integer
                  example: 1200
                occurred_at:
                  type: string
                  format: date-time
                  example: "2026-05-11T14:00:00Z"
                project_id:
                  type: string
                  format: uuid
                  description: Optional. Stripped silently if not accessible to the token's org/user.
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                        example: true
                      rawEventKey:
                        type: string
                        description: MinIO object key for the raw event payload
                        example: events/2026/05/11/abc123.json
                      workflowId:
                        type: string
                        description: Temporal workflow ID (absent if Temporal unavailable)
                      fallback:
                        type: boolean
                        description: Present and true when Temporal unavailable and event was inserted directly
                    required:
                      - accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: |
            Rate limit exceeded or monthly quota reached.
            Check the `code` field to distinguish the two cases.
            Respect the `Retry-After` header before retrying.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying. Capped at 3600 for quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

